[package]
name = "{{ident}}"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Encore's Rust SDK: the Postgres database, logging and graceful shutdown.
encore-dev = "={{sdk_version}}"
axum = "0.8"
log = { version = "0.4", features = ["kv"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
